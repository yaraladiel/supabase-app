<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mi-app-supabase</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="main">
      <h1>Aprendiendo Supabase homework</h1>

      <section class="insert">
        <form class="form">
          <input type="text" name="name" placeholder="Inserta el nombre" required />
          <input type="number" name="price" placeholder="Inserta el precio" step="0.01" required />
          <textarea name="descripcion" placeholder="Inserta la descripción"></textarea>
          <button type="submit">Registrar</button>
        </form>
      </section>

      <section class="data">
        <button class="btn">Mostrar productos</button>

        <section class="data-table">
          <table class="table">
            <thead class="thead"></thead>
            <tbody class="tbody"></tbody>
          </table>
        </section>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
